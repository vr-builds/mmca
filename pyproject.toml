[project]
name = "mmca"
version = "0.1.0"
description = "Multi-cavity Measurement Capability Analysis"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B905"]  # zip() strict= is noise here
